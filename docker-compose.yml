services:
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    ports:
      - "6379:6379"
    # "volumes" olmadan bilerek bırakıyoruz - Redis'teki veri (cache) kalıcı
    # olmasın istiyoruz, container yeniden başlarsa sıfırdan başlasın.
    # Bu, cache'in doğasına uygun: kaybolsa da veritabanından yeniden üretilebilir.

  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    ports:
      # 5432 yerine 5433: bu makinede native bir PostgreSQL Windows servisi
      # (postgresql-x64-18) zaten 5432'yi dinliyor ve host'tan gelen bağlantıları
      # container yerine kendisi kapıyor - bu yüzden host tarafını 5433'e aldık
      # (container İÇİNDE hâlâ 5432, sadece dışa açılan port değişti).
      - "5433:5432"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: AtlasAi
    # Redis'in aksine BURADA volume KULLANIYORUZ - embedding verisi kalıcı
    # olmalı, container yeniden başlayınca (ya da bilgisayar restart olunca)
    # kaybolmamalı. "atlas-postgres-data" adında bir Docker volume, container
    # silinse bile diskte kalıcı olarak durur.
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data

  # Native SQL Server Express (.\SQLEXPRESS, Windows Authentication) yerine -
  # SADECE bu compose stack'i (atlas-api dahil hepsi) tek komutla ayağa
  # kalksın diye. Windows Authentication konteynerde çalışmıyor, bu yüzden
  # SQL Server kimlik doğrulaması (sa kullanıcısı) kullanılıyor - appsettings.json'daki
  # native dev bağlantı dizesine (Trusted_Connection) HİÇ dokunulmadı, atlas-api
  # servisi kendi ConnectionStrings__DefaultConnection'ını ortam değişkeniyle
  # override ediyor (ikisi birbirinden bağımsız, biri diğerini bozmuyor).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: atlas-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Sadece bu compose stack'i içinde kullanılan, gerçek bir prod sırrı
      # OLMAYAN yerel/demo şifresi - Postgres servisindeki atlas_dev_password
      # ile aynı gerekçe (yukarıda zaten committed).
      MSSQL_SA_PASSWORD: "AtlasDevPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - atlas-sqlserver-data:/var/opt/mssql

  # Tüm .NET modüllerini ayağa kaldıran composition root. Migration'ları
  # (Auth/Wiki/AI/Audit) Program.cs zaten her açılışta otomatik uyguluyor -
  # ekstra bir "migrate" adımı gerekmiyor, sqlserver/postgres hazır olur olmaz
  # kendisi tabloları oluşturur.
  atlas-api:
    build:
      context: .
      dockerfile: src/Host/Atlas.Api/Dockerfile
    container_name: atlas-api
    depends_on:
      - sqlserver
      - postgres
      - redis
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # "__" (çift alt çizgi), ASP.NET Core'un ortam değişkenleriyle iç içe
      # config anahtarlarını (ConnectionStrings:DefaultConnection gibi)
      # eşleştirme yöntemi - appsettings.json'daki değeri override ediyor.
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AtlasPlatform;User Id=sa;Password=AtlasDevPassword123!;TrustServerCertificate=True"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=AtlasAi;Username=atlas;Password=atlas_dev_password"
      ConnectionStrings__Redis: "redis:6379"
      # Native dev'de RootPath hiç verilmez, DocumentsModule.cs kendisi
      # %LOCALAPPDATA%'yı hesaplar (bkz. oradaki not) - ama konteynerde
      # %LOCALAPPDATA% diye bir şey YOK (Linux imajı) ve varsayılan da
      # container'ın YAZILABİLİR OLMAYAN katmanına düşerdi. P7 ÖNCESİNDE bu
      # override HİÇ yoktu - "docker compose down" yüklenen belgeleri
      # sessizce siliyordu (DB satırları kalıyordu, StorageKey'ler artık
      # var olmayan dosyalara işaret ediyordu). Aşağıdaki volume ile birlikte
      # (atlas-documents-data) artık kalıcı.
      DocumentStorage__RootPath: "/data/documents"
      # Native dev'de bu User Secrets'ta duruyor (konteynerin host'un User
      # Secrets'ına erişimi yok) - burada SADECE bu compose stack'i için
      # geçerli, ayrı bir demo anahtarı. Gerçek bir ortamda mutlaka gerçek
      # bir secret store'dan (ör. Docker secrets, Key Vault) gelmeli.
      Jwt__Key: "docker-compose-only-dev-signing-key-never-used-elsewhere"
      Jwt__Issuer: "AtlasPlatform"
      Jwt__Audience: "AtlasPlatformUsers"
    # Postgres/SQL Server'daki AYNI "veri kalıcı olmalı" gerekçesi - belgenin
    # KENDİSİ (diskteki dosya) Postgres'teki embedding'lerle ya da SQL
    # Server'daki Document satırlarıyla AYNI kalıcılık garantisine sahip
    # olmalı, aksi halde "belge var ama dosyası yok" gibi tutarsız bir durum
    # oluşurdu (StorageKey DB'de duruyor, indirme 404/500 verirdi).
    volumes:
      - atlas-documents-data:/data/documents

  # React SPA'yı derleyip nginx ile statik olarak sunuyor - native dev'deki
  # (npm run dev, Vite) AYNI host portuna (5173) eşleniyor ki backend'in CORS
  # politikası (WithOrigins("http://localhost:5173")) HİÇ değişmesin.
  atlas-web:
    build:
      context: ./Web
      dockerfile: apps/platform/Dockerfile
    container_name: atlas-web
    depends_on:
      - atlas-api
    ports:
      - "5173:80"

volumes:
  atlas-postgres-data:
  atlas-sqlserver-data:
  atlas-documents-data: