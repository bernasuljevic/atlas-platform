server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing kullanıyor (/wiki, /audit-log gibi
    # gerçek bir dosya karşılığı olmayan yollar) - nginx bunları 404
    # döndürmek yerine her zaman index.html'e düşürmeli, React tarafı
    # kendi routing'ini oradan devam ettirir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
